name: Deploy Migrations to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: cvhbelkqkyvcvkedwqjb

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Check migrator credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Add GitHub Actions secrets SUPABASE_ACCESS_TOKEN and PRODUCTION_DB_PASSWORD."
            exit 1
          fi

      - name: Apply pending migrations
        run: supabase db push --yes --project-ref "$SUPABASE_PROJECT_ID" --skip-vault
